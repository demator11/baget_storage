name: Backend

on:
  push:
    branches: ["master", "backend/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: baget
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: baget_storage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baget -d baget_storage_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BAGET_ENVIRONMENT: test
      BAGET_DATABASE_URL: postgresql+asyncpg://baget:ci-only-password@localhost:5432/baget_storage_test
      BAGET_TEST_DATABASE_URL: postgresql+asyncpg://baget:ci-only-password@localhost:5432/baget_storage_test
      BAGET_JWT_SECRET: ci-only-signing-key-never-use-outside-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.14"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: docker build --tag baget-storage:ci .
      - run: |
          docker run --detach --name baget-storage-api --network host --env BAGET_ENVIRONMENT --env BAGET_DATABASE_URL --env BAGET_JWT_SECRET baget-storage:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health/ready
      - if: always()
        run: docker rm --force baget-storage-api || true
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
