services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baget_storage
      POSTGRES_USER: baget
      POSTGRES_PASSWORD: ${BAGET_POSTGRES_PASSWORD:?Set BAGET_POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baget -d baget_storage"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment:
      BAGET_DATABASE_URL: postgresql+asyncpg://baget:${BAGET_POSTGRES_PASSWORD}@db:5432/baget_storage
      BAGET_JWT_SECRET: ${BAGET_JWT_SECRET:?Set BAGET_JWT_SECRET}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      BAGET_ENVIRONMENT: ${BAGET_ENVIRONMENT:-local}
      BAGET_DATABASE_URL: postgresql+asyncpg://baget:${BAGET_POSTGRES_PASSWORD}@db:5432/baget_storage
      BAGET_JWT_SECRET: ${BAGET_JWT_SECRET:?Set BAGET_JWT_SECRET}
      BAGET_CORS_ORIGINS: ${BAGET_CORS_ORIGINS:-[]}
      BAGET_ACCESS_TOKEN_MINUTES: ${BAGET_ACCESS_TOKEN_MINUTES:-60}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
